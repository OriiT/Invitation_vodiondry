# Configuration Cloudflare Workers — Vodiondry Orimbato & Rojo
name = "vodiondry"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Le site d'invitation (dossier public/) est servi tel quel par Workers Static Assets.
# Les routes ci-dessous passent d'abord par le Worker (page personnalisée, API, administration).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/i/*", "/api/*", "/admin", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "vodiondry"
# ⚠️ Remplacez la valeur ci-dessous par l'identifiant affiché par « npx wrangler d1 create vodiondry »
database_id = "b817dcaf-9038-4498-a46a-84f120804ce2"
migrations_dir = "migrations"

[observability]
enabled = true

# Secrets (jamais dans ce fichier) :
#   npx wrangler secret put ADMIN_PASSWORD
#   npx wrangler secret put SESSION_SECRET
# En local, ils sont lus depuis le fichier .dev.vars (créé automatiquement par « npm run dev »).
