# Tests à chaque modification, puis mise en ligne automatique sur Cloudflare à chaque mise à jour de « main ».
# Aucun serveur personnel n'est nécessaire : tout tourne chez GitHub, le site tourne chez Cloudflare.
#
# Secrets à créer dans GitHub (Settings → Secrets and variables → Actions → New repository secret) :
#   CLOUDFLARE_API_TOKEN   jeton API Cloudflare (modèle « Edit Cloudflare Workers » + « D1 : Edit »)
#   CLOUDFLARE_ACCOUNT_ID  identifiant du compte Cloudflare
#   ADMIN_PASSWORD         mot de passe de l'administration (/admin)
#   SESSION_SECRET         longue chaîne aléatoire (au moins 32 caractères)
# Tant qu'ils manquent (ou que database_id n'est pas renseigné dans wrangler.toml), la mise en ligne est
# simplement sautée, avec un message : les tests, eux, tournent toujours.

name: Tests et mise en ligne

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  deploy:
    name: Mise en ligne sur Cloudflare
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la configuration
        id: check
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$ADMIN_PASSWORD" ] || missing="$missing ADMIN_PASSWORD"
          [ -n "$SESSION_SECRET" ] || missing="$missing SESSION_SECRET"
          if grep -q '00000000-0000-0000-0000-000000000000' wrangler.toml; then
            missing="$missing database_id(wrangler.toml)"
          fi
          if [ -n "$missing" ]; then
            echo "::notice title=Mise en ligne non configurée::Il manque :$missing. Voir le README, partie « Mise en ligne sans serveur »."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Installer
        if: steps.check.outputs.ready == 'true'
        run: npm ci

      - name: Mettre à jour les tables de la base D1
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler d1 migrations apply vodiondry --remote

      - name: Publier le site
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy

      - name: Enregistrer les secrets de l'administration
        if: steps.check.outputs.ready == 'true'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          umask 077
          f="$RUNNER_TEMP/secrets.json"
          node -e 'process.stdout.write(JSON.stringify({ ADMIN_PASSWORD: process.env.ADMIN_PASSWORD, SESSION_SECRET: process.env.SESSION_SECRET }))' > "$f"
          npx wrangler secret bulk "$f"
          rm -f "$f"
