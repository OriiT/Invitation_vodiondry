# Outils Docker (facultatifs) : le site en ligne est hébergé par Cloudflare et ne dépend pas de cette machine.
#
#   docker compose up -d dev
#       → essai local sur http://<ip-du-serveur>:8787 (admin : /admin, mot de passe « admin-local »)
#   docker compose run --rm cli npx wrangler whoami
#       → commandes Cloudflare ; jeton dans le fichier .env (voir .env.example)
#   docker compose run --rm cli npm run import -- donnees/Budget_reception_5.xlsx --dry-run
#       → import en ligne depuis le dossier ./donnees (fichiers jamais copiés dans l'image)
#
# « pull_policy: build » : l'image est reconstruite à partir des fichiers actuels avant chaque lancement
# (rapide si rien n'a changé), pour ne jamais utiliser une ancienne version du code.
# Port 8787 : ouvert sur toutes les adresses du serveur par défaut (Docker passe avant le pare-feu ufw).
# Pour le limiter, mettez par exemple ADRESSE_ECOUTE=127.0.0.1 ou ADRESSE_ECOUTE=192.168.1.15 dans .env.

services:
  dev:
    build: .
    image: vodiondry-outils
    pull_policy: build
    ports:
      - "${ADRESSE_ECOUTE:-0.0.0.0}:8787:8787"
    volumes:
      - vodiondry-local:/app/.wrangler

  cli:
    build: .
    image: vodiondry-outils
    pull_policy: build
    profiles: ["cli"]
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    volumes:
      - ./wrangler.toml:/app/wrangler.toml:ro
      - ./donnees:/app/donnees:ro
    command: ["npx", "wrangler", "--version"]

volumes:
  vodiondry-local:
